openapi: 3.1.0
info:
  title: KinuFlow API
  version: 1.0.0
  description: REST API contract for the KinuFlow Mini Kanban Board.

servers:
  - url: http://localhost:8000
    description: Local development server

tags:
  - name: Tasks
    description: Manage tasks on the KinuFlow Kanban board.

paths:
  /tasks:
    get:
      tags:
        - Tasks
      summary: List tasks
      operationId: listTasks
      responses:
        "200":
          description: All tasks on the board.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Task"
    post:
      tags:
        - Tasks
      summary: Create a task
      operationId: createTask
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskCreate"
      responses:
        "201":
          description: Task created successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "422":
          $ref: "#/components/responses/ValidationError"

  /tasks/{task_id}:
    parameters:
      - $ref: "#/components/parameters/TaskId"
    get:
      tags:
        - Tasks
      summary: Get one task
      operationId: getTask
      responses:
        "200":
          description: The requested task.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "404":
          $ref: "#/components/responses/TaskNotFound"
    patch:
      tags:
        - Tasks
      summary: Update a task
      description: Update one or more editable task fields, including its status.
      operationId: updateTask
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskUpdate"
      responses:
        "200":
          description: Task updated successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "404":
          $ref: "#/components/responses/TaskNotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
    delete:
      tags:
        - Tasks
      summary: Delete a task
      operationId: deleteTask
      responses:
        "200":
          description: Task deleted successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskDeleteResponse"
        "404":
          $ref: "#/components/responses/TaskNotFound"

components:
  parameters:
    TaskId:
      name: task_id
      in: path
      required: true
      description: String identifier of the task.
      schema:
        type: string
      example: task-1

  schemas:
    TaskFields:
      type: object
      description: Fields supplied by the user when creating or editing a task.
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 120
          example: Automate invoice intake
        description:
          type: string
          minLength: 1
          maxLength: 500
          example: Map the current invoice workflow and identify repetitive steps.
        category:
          $ref: "#/components/schemas/TaskCategory"
        priority:
          $ref: "#/components/schemas/TaskPriority"
        status:
          $ref: "#/components/schemas/TaskStatus"

    TaskCreate:
      allOf:
        - $ref: "#/components/schemas/TaskFields"
        - type: object
          required:
            - title
            - description
            - category
            - priority
            - status
      unevaluatedProperties: false

    TaskUpdate:
      allOf:
        - $ref: "#/components/schemas/TaskFields"
        - type: object
          minProperties: 1
      unevaluatedProperties: false
      example:
        status: in_progress

    Task:
      allOf:
        - $ref: "#/components/schemas/TaskFields"
        - type: object
          required:
            - id
            - title
            - description
            - category
            - priority
            - status
            - created_at
            - updated_at
          properties:
            id:
              type: string
              readOnly: true
              example: task-1
            created_at:
              type: string
              format: date-time
              readOnly: true
              example: "2026-09-14T09:30:00Z"
            updated_at:
              type: string
              format: date-time
              readOnly: true
              example: "2026-09-14T10:15:00Z"
      unevaluatedProperties: false

    TaskCategory:
      type: string
      enum:
        - AI Automation
        - Data
        - Internal Operations
        - Other
      example: AI Automation

    TaskPriority:
      type: string
      enum:
        - Low
        - Medium
        - High
      example: High

    TaskStatus:
      type: string
      enum:
        - incoming
        - analyzing
        - planned
        - in_progress
        - done
      example: analyzing

    TaskDeleteResponse:
      type: object
      required:
        - id
      properties:
        id:
          type: string
          example: task-1
      additionalProperties: false

    Error:
      type: object
      required:
        - detail
      properties:
        detail:
          type: string
      additionalProperties: false

  responses:
    TaskNotFound:
      description: No task exists for the supplied identifier.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            detail: Task not found.
    ValidationError:
      description: The request body contains invalid task data.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            detail: Invalid task data.
