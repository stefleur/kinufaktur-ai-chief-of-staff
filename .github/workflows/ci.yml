name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-tests:
    name: Backend tests (non-integration)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/homework2/backend/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Setup uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: '0.12.15'
      - name: Show uv version
        run: uv --version

      - name: Install backend dependencies (uv sync)
        working-directory: homework2/backend
        run: uv sync --group dev

      - name: Run non-integration tests
        working-directory: homework2/backend
        run: uv run pytest -m "not integration"

  backend-integration:
    name: Backend integration tests
    runs-on: ubuntu-latest
    needs: backend-tests
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/homework2/backend/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Setup uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: '0.12.15'
      - name: Show uv version
        run: uv --version

      - name: Install backend dependencies (uv sync)
        working-directory: homework2/backend
        run: uv sync --group dev

      - name: Run integration tests
        working-directory: homework2/backend
        run: uv run pytest -m integration

  frontend-verification:
    name: Frontend verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/homework2/frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install frontend dependencies
        working-directory: homework2/frontend
        run: npm ci

      - name: Build frontend
        working-directory: homework2/frontend
        run: npm run build

      - name: Lint (if configured)
        working-directory: homework2/frontend
        run: |
          if npm run | grep -q "lint"; then npm run lint; else echo "No lint script configured"; fi

  container-verification:
    name: Container verification
    runs-on: ubuntu-latest
    needs: [frontend-verification, backend-integration]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: ./homework2/backend
          file: ./homework2/backend/Dockerfile
          push: false
          tags: ci/homework2-backend:latest

      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./homework2/frontend
          file: ./homework2/frontend/Dockerfile
          push: false
          tags: ci/homework2-frontend:latest

      - name: Validate docker-compose
        run: docker compose -f homework2/docker-compose.yml config
