name: Deploy Frontend to GitHub Pages

on:
  push:
    branches: [ main ]

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        working-directory: homework2/frontend
        run: npm ci

      - name: Build frontend
        working-directory: homework2/frontend
        env:
          # Provide VITE_API_BASE from repository variables or secrets.
          VITE_API_BASE: ${{ vars.VITE_API_BASE }}
          # Optional VITE_BASE for GitHub Pages repo subpath; default is './'
          VITE_BASE: ${{ vars.VITE_BASE }}
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: homework2/frontend/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
