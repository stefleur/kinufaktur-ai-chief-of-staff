name: Deploy Final Project

on:
  push:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  deploy_backend:
    needs: checks
    # Explicit owner opt-in; absent/false skips deployment without credentials.
    if: ${{ vars.FASTAPI_CLOUD_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install uv
        run: python -m pip install uv==0.12.23

      - name: Install locked backend dependencies
        working-directory: final-project/backend
        run: uv sync --locked --no-dev

      - name: Deploy existing FastAPI Cloud app
        working-directory: final-project/backend
        env:
          FASTAPI_CLOUD_TOKEN: ${{ secrets.FASTAPI_CLOUD_TOKEN }}
          FASTAPI_CLOUD_APP_ID: ${{ secrets.FASTAPI_CLOUD_APP_ID }}
        run: |
          if [ -z "$FASTAPI_CLOUD_TOKEN" ] || [ -z "$FASTAPI_CLOUD_APP_ID" ]; then
            echo "Configure FASTAPI_CLOUD_TOKEN and FASTAPI_CLOUD_APP_ID before enabling deployment."
            exit 1
          fi
          # Upload the repository root; app Application Directory must be final-project/backend.
          uv run --locked fastapi deploy ../..

  build_and_deploy:
    needs: checks
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: final-project/frontend
        run: npm ci

      - name: Build frontend
        working-directory: final-project/frontend
        env:
          # Provide VITE_API_BASE from repository variables or secrets.
          VITE_API_BASE: ${{ vars.VITE_API_BASE }}
          # Optional asset base; default remains /kinufaktur-ai-chief-of-staff/
          VITE_BASE: ${{ vars.VITE_BASE }}
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: final-project/frontend/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
