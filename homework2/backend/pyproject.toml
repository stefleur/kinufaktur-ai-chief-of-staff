[project]
name = "kinuflow-backend"
version = "0.1.0"
description = "FastAPI backend for the KinuFlow Mini Kanban Board"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "sqlalchemy>=2.0.53",
    "uvicorn[standard]>=0.53.0",
    "psycopg[binary]>=3.1",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
